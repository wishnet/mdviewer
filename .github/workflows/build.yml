name: Build EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller pywebview
          pip install markdown pymdown-extensions Pygments

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole --icon=icon.ico --hidden-import webview --hidden-import webview.platforms.edgechromium --hidden-import json --hidden-import threading --collect-all webview --name MDViewer mdviewer.py

      - name: Upload EXE as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MDViewer
          path: dist/MDViewer.exe

      - name: Create Release and upload
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MDViewer.exe
